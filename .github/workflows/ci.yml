name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Validate setup.sh syntax
        run: bash -n setup.sh

      - name: Validate scripts
        run: |
          bash -n scripts/backup.sh

      - name: Lint scripts with shellcheck (if available)
        run: |
          brew install shellcheck 2>/dev/null || true
          shellcheck setup.sh scripts/*.sh || true